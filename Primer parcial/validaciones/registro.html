<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../CSS/style.css">
    <title>Registrar Asistencia - CECyT 9</title>
</head>

<body>

    <header>
        <a href="./detalle.html">
            Volver al detalle del taller
        </a>
    </header>

    <form class="formulario-registro" id="formulario">

        <h1>Formulario de registro de asistencia</h1>

        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" required>

        <label for="boleta">Número de boleta</label>
        <input type="text" id="boleta" name="boleta" required>

        <button type="submit">Registrar asistencia</button>

        <p id="mensaje"></p>

    </form>

    <script>
        const formulario = document.getElementById("formulario");
        const mensaje = document.getElementById("mensaje");

        formulario.addEventListener("submit", function(event) {
            event.preventDefault();

            if (formulario.checkValidity()) {
                mensaje.textContent = "¡Registro exitoso! Tu asistencia ha sido registrada.";
                mensaje.className = "exito";
                formulario.reset();
            } else {
                mensaje.textContent = "Registro incorrecto. Por favor, completa todos los campos.";
                mensaje.className = "error";
            }
        });
    </script>

</body>
</html>
